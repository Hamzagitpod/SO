<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de Menu TMS (Version Titan)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.0/mammoth.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loader {
            border-top-color: #667eea;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        .details-row {
            transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .details-row.open {
            max-height: 500px;
            opacity: 1;
        }
        input:focus, textarea:focus {
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.5);
            outline: none;
        }
        .file-preview {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.1.0/",
        "@google/genai": "https://esm.sh/@google/genai"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold text-gray-800 bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-blue-500">
                Convertisseur de Menu TMS Titan
            </h1>
            <p class="text-lg text-gray-600 mt-3">Transformez vos menus en un format impeccable avec une puissance décuplée.</p>
        </header>

        <div id="app" class="space-y-8">
            <!-- Étape 1: Entrée du Menu -->
            <div id="step1" class="card p-8 rounded-2xl shadow-lg">
                <div class="flex items-center mb-6">
                    <span class="bg-gradient-to-br from-purple-500 to-blue-500 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold text-xl mr-4 shadow-md">1</span>
                    <h2 class="text-3xl font-semibold text-gray-700">Importer le Menu</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Option A: Coller du texte</label>
                        <textarea id="text-input" class="w-full h-48 p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition" placeholder="Collez un menu complet ici..."></textarea>
                    </div>
                    <div>
                         <label class="block text-gray-700 font-medium mb-2">Option B: Télécharger des fichiers</label>
                        <div id="drop-zone" class="flex flex-col items-center justify-center w-full p-4 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50/50 hover:border-purple-400 transition group">
                            <input type="file" id="file-input" class="hidden" accept="image/png, image/jpeg, application/pdf, .docx, application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple>
                            <label for="file-input" class="cursor-pointer text-center">
                                <svg class="w-12 h-12 mx-auto text-gray-400 group-hover:text-purple-500 transition mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <span class="text-purple-600 font-medium">Choisir jusqu'à 7 fichiers</span>
                                <p class="text-sm text-gray-500 mt-1">ou glissez-déposez</p>
                            </label>
                        </div>
                        <div id="gallery-preview" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 mt-4"></div>
                    </div>
                </div>
                <!-- API Key input removed as per guidelines -->
                <div class="mt-8 text-center">
                    <button id="process-btn" class="btn-primary text-white font-bold py-3 px-8 rounded-lg text-lg">
                        Analyser le Menu
                    </button>
                </div>
            </div>

            <div id="loader" class="hidden text-center p-6">
                 <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-24 w-24 mx-auto"></div>
                <p class="mt-4 text-xl font-semibold text-gray-700">Analyse en cours... L'IA structure votre menu.</p>
                 <p id="loader-subtitle" class="text-gray-600 mt-2"></p>
            </div>
            <div id="step2" class="card p-8 rounded-2xl shadow-lg hidden"></div>
            <div id="step3" class="card p-8 rounded-2xl shadow-lg text-center hidden"></div>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
